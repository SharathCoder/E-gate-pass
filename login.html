<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zing Login Gate Pass</title>
    <link rel="manifest" href="manifest.json"> <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body style="align-items: center;">
    <div class="app-container" style="max-width: 400px;">
        <header>
            <div class="zing-logo">
                <span class="letter z">Z</span>
                <span class="letter i">I</span>
                <span class="letter n">N</span>
                <span class="letter g">G</span>
            </div>
            
            <h1>Secure Gate</h1>
            <p>Identity & Access Management</p>
        </header>

        <main class="card fade-in">
            <h2>System Login</h2>
            <div id="loginError" class="result-banner error-banner hidden" style="font-size: 0.85rem; padding: 10px;"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="User@gmail.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" required placeholder="........" style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        
                        <span id="togglePassword" style="position: absolute; right: 10px; cursor: pointer; color: #64748b; display: flex; align-items: center; transition: 0.2s;">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn-primary" style="width: 100%; margin-bottom: 10px;">Authenticate</button>
                
                <div style="text-align: center; margin: 15px 0; color: #64748b; font-size: 0.9rem;">— OR —</div>
                
                <button type="button" id="googleBtn" class="btn-primary" style="width: 100%; background: white; color: #0f172a; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign in with Google
                </button>
            </form>
        </main>
        <footer class="global-footer" style="margin-top: 20px;">
            <div style="width: 100%; text-align: center; color: #64748b; font-size: 0.8rem;">
                &copy; 2026 ZING. All Rights Reserved.<br>
                 <a href="privacy-policy.html" style="color: #3b82f6; text-decoration: none; margin: 0 5px;">Privacy</a> | 
                 <a href="terms.html" style="color: #3b82f6; text-decoration: none; margin: 0 5px;">Terms</a>
           </div>
        </footer>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const loginForm = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const googleBtn = document.getElementById('googleBtn');
        const errorDiv = document.getElementById('loginError');
        // --- NEW: PASSWORD VISIBILITY TOGGLE ---
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            // Check current state
            const isPassword = passwordInput.getAttribute('type') === 'password';
            
            // Toggle the input type
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Toggle the eye icon color and shape
            togglePassword.style.color = isPassword ? '#2563eb' : '#64748b'; // Turns blue when active
            if (isPassword) {
                // Eye-Open SVG Path
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                // Eye-Closed SVG Path
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        });
        
        // 1. AUTO-LOGIN ROUTER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                btn.innerText = "Session Found. Routing...";
                btn.disabled = true;
                googleBtn.disabled = true;
                await routeUserToDashboard(user.uid);
            }
        });

        // 2. MANUAL EMAIL/PASSWORD LOGIN
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.innerText = "Verifying Identity...";
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(
                    auth,
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                await routeUserToDashboard(userCredential.user.uid);
            } catch (error) {
                handleError(error);
            }
        });

        // 3. GOOGLE OAUTH LOGIN (The New Feature)
        const googleProvider = new GoogleAuthProvider();
        googleBtn.addEventListener('click', async () => {
            googleBtn.innerText = "Opening Google...";
            googleBtn.disabled = true;
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                // Check if this Google User exists in our 'users' collection
                const userRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userRef);

                // If they don't exist, register them silently in the database!
                if (!userDoc.exists()) {
                    await setDoc(userRef, {
                        name: user.displayName,
                        email: user.email,
                        role: 'student', // All Google sign-ins default to 'student'
                        status: 'ACTIVE',
                        createdAt: serverTimestamp()
                    });
                }

                await routeUserToDashboard(user.uid);

            } catch (error) {
                handleError(error);
            }
        });

        // 4. MASTER ROUTING FUNCTION
        async function routeUserToDashboard(uid) {
            try {
                const userDoc = await getDoc(doc(db, "users", uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    if (userData.status === "BLOCKED") throw new Error("Your account has been restricted.");

                    // Route based on role
                    if (userData.role === 'admin') window.location.href = "admin.html";
                    else if (userData.role === 'watchman') window.location.href = "watchman.html";
                    else window.location.href = "index.html"; // Default to student portal
                    
                } else {
                    throw new Error("Profile missing in database. Contact Admin.");
                }
            } catch (error) {
                handleError(error);
            }
        }

        function handleError(error) {
            console.error("Auth Error:", error);
            errorDiv.innerText = error.message || "Authentication failed. Please try again.";
            errorDiv.classList.remove('hidden');
            btn.innerText = "Authenticate";
            btn.disabled = false;
            googleBtn.innerHTML = `<svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Sign in with Google`;
            googleBtn.disabled = false;
        }
    </script>
    
</body>
</html>
